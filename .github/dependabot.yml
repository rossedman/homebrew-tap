version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
    open-pull-requests-limit: 5
