name: Install or upgrade problem
description: brew install, upgrade or uninstall failed, or an installed tool won't run.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Bugs in a tool's own behavior belong in that tool's repository; the README links to each one. For security problems, use the [security policy](https://github.com/rossedman/homebrew-tap/blob/main/SECURITY.md).
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - limabean
        - muscles
        - sarifix
        - sminer
        - tfmetrics
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `brew config`, which includes your Homebrew version, OS and CPU.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The brew commands you ran.
      placeholder: brew install rossedman/tap/sarifix
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The full output, rerun with `--verbose --debug`.
      render: text
