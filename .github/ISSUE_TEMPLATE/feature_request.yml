name: Tap request
description: Suggest a change to the tap itself, such as a new platform or install option.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests for a tool belong in that tool's repository; the README links to each one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to do with the tap, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
